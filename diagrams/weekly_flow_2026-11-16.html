ays no pets. On Nov 16 every purchase listing was pet-silent, so Claude featured them flagged 'pet rules unprinted' and set two garage rentals aside.","suggested":"Kyle picks one rule for all agents (for purchases most likely: allowed unless the listing or HOA says no; confirm with the HOA before an offer).","events":["Claude Cowork/CLAUDE-03","Claude Cowork/CLAUDE-04","Claude Cowork/DUETVIEW-03"]},{"ref":"Claude Cowork:C-05","writer":"Claude Cowork","id":"C-05","title":"Monday tour verdicts: three readers, one writer","detail":"Muse writes verdicts at 9:11 AM, Grok reads at about 9:00 and Claude reads at about 10:05. Claude's timing is safe, but Kyle often hasn't logged verdicts by Monday morning (none for Nov 12 or Nov 15 by Nov 16), so the briefing re-checks instead.","suggested":"No change needed for Claude; the merge should show Claude as a downstream reader of Muse's sheet.","events":["Claude Cowork/CLAUDE-02","Claude Cowork/MUSEVIEW-01"]},{"ref":"Claude Cowork:C-06","writer":"Claude Cowork","id":"C-06","title":"Morning overlap with Duet's brief","detail":"Claude's run push and Duet's 10:19 AM chat brief arrive within about 30 minutes on Mon/Wed/Fri and can both report the same tour, lender or listing news.","suggested":"Optionally move the briefing earlier or later, or let Duet's brief point to the email instead of repeating it.","events":["Claude Cowork/CLAUDE-06","Claude Cowork/CLAUDE-07","Claude Cowork/DUETVIEW-02"]},{"ref":"Claude Cowork:C-07","writer":"Claude Cowork","id":"C-07","title":"Claude is outside the Agent Updates loop","detail":"The briefing logs to its own Sheet only. Duet, Grok and Muse can't see what it featured or learned except by reading its emails, and it never votes on the Shared Sheet.","suggested":"Add one Updates Log row per run to the Shared Sheet (Event DONE, issue number, counts), or give Duet read access to the Claude state Sheet's run log.","events":["Claude Cowork/CLAUDE-08"]},{"ref":"Claude Cowork:C-08","writer":"Claude Cowork","id":"C-08","title":"Nestfield site is stale for Claude listings","detail":"The authorized ingest hasn't run since Oct 2, while Claude Code adds keep landing, so the site mixes old Claude data with newer Kyle adds.","suggested":"Kyle decides whether to restart the ingest or retire it.","events":["Claude Cowork/CLAUDE-09","Claude Cowork/CLAUDE-12"]},{"ref":"ChatGPT:C-CGPT-01","writer":"ChatGPT","id":"C-CGPT-01","title":"Timing mismatch","detail":"Other week files cite 6:06/6:07 AM, uncertain days or stopped emails. Saved ChatGPT schedule is Tue/Thu 04:00; Issue 44 sent Nov 17. Start and actual delivery are different.","suggested":"Use current self schedule; retain historical views as faint mismatch markers.","events":["ChatGPT/CGPT-01","ChatGPT/CGPT-04"]},{"ref":"ChatGPT:C-CGPT-02","writer":"ChatGPT","id":"C-CGPT-02","title":"Tour ownership versus refresh","detail":"Weekend-only ChatGPT view omits Wed–Sat 05:00 monitoring. Duet sends Gwen list; ChatGPT monitors and publishes only on request.","suggested":"Do not equate a scheduled check, candidate readiness or external report with permission to publish.","events":["ChatGPT/CGPT-10","ChatGPT/CGPT-12","ChatGPT/DUETVIEW-DUET-09"]},{"ref":"ChatGPT:C-CGPT-03","writer":"ChatGPT","id":"C-CGPT-03","title":"Different email and site policies","detail":"Rental briefing sends email and uses Apify; tour workflow forbids email and Apify.","suggested":"Keep these as separate sub-lanes with scoped tool rules.","events":["ChatGPT/CGPT-03","ChatGPT/CGPT-04","ChatGPT/CGPT-12"]},{"ref":"ChatGPT:C-CGPT-04","writer":"ChatGPT","id":"C-CGPT-04","title":"Parallel mom emails","detail":"ChatGPT Tue/Thu briefing overlaps purpose with Claude M/W/F and Duet pick page, though different clocks.","suggested":"Expose notifications overlay; make no scheduling changes without Kyle.","events":["ChatGPT/CGPT-04","ChatGPT/CLAUDEVIEW-CLAUDE-06","ChatGPT/DUETVIEW-DUET-06"]},{"ref":"ChatGPT:C-CGPT-05","writer":"ChatGPT","id":"C-CGPT-05","title":"Stale upload dependency","detail":"Grok photo packs are request-driven, not confirmed Wednesday scheduled deliveries; 05:00 site checks may precede new files.","suggested":"Show optional provenance edges; missing packs can fall back to exact sources.","events":["ChatGPT/CGPT-10","ChatGPT/GROKVIEW-GROK-09"]},{"ref":"ChatGPT:C-CGPT-06","writer":"ChatGPT","id":"C-CGPT-06","title":"Shared Sheet is not ChatGPT state","detail":"Agent Updates shared coordination sheet and primary ChatGPT memory are distinct; no ChatGPT shared-sheet writer job was verified.","suggested":"Do not inherit handoff instructions to create a new recurring shared-sheet writer.","events":["ChatGPT/CGPT-05"]},{"ref":"ChatGPT:C-CGPT-07","writer":"ChatGPT","id":"C-CGPT-07","title":"Post-send website queue","detail":"Issue 44 email succeeded but Nestfield ingest remains queued because configured authentication was unavailable. Tour site is a separate workflow.","suggested":"Show degraded ingest, not failed email or failed tour site.","events":["ChatGPT/CGPT-06","ChatGPT/CGPT-12"]},{"ref":"ChatGPT:C-CGPT-08","writer":"ChatGPT","id":"C-CGPT-08","title":"Cross-agent draft and duplicate-notification disputes","detail":"Crosscheck reports Grok Wednesday Gmail draft versus requested doc-only ranking, Muse Thursday draft and confirmation nudges, and Monday feedback timing.","suggested":"Retain as reported conflicts; owners must verify their current jobs.","events":["ChatGPT/GROKVIEW-PD-03","ChatGPT/MUSEVIEW-MUSE-10","ChatGPT/MUSEVIEW-MUSE-05"]},{"ref":"ChatGPT:C-CGPT-09","writer":"ChatGPT","id":"C-CGPT-09","title":"Merge key and ID collisions","detail":"Several writers reuse CGPTVIEW-01 and -02. Claude phase times also place send before its stated render phase; they mix observed and estimated times.","suggested":"Namespace by writer filename plus event id. Preserve source confidence and order edges; never fabricate exact substep times.","events":["ChatGPT/CLAUDEVIEW-CLAUDE-01","ChatGPT/CLAUDEVIEW-CLAUDE-06"]}],"decision []},{"text":"Summary to Property Desk","r":[],"w":["Grok Bot/BR-01","ChatGPT/GROKVIEW-BR-01"]},{"text":"Tasks page","r":["Duet/DUET-01","Duet/DUET-04","Duet/DUET-05","Muse/DUETVIEW-04","Muse/DUETVIEW-05"],"w":[]},{"text":"The run's own results","r":["Claude Cowork/CLAUDE-07"],"w":[]},{"text":"Unknown","r":["Muse/CGPTVIEW-01"],"w":[]},{"text":"Validated HTML","r":["ChatGPT/CGPT-04"],"w":[]},{"text":"Verified delivery record","r":[],"w":["ChatGPT/CGPT-04"]},{"text":"weather","r":["Muse/MUSE-11"],"w":[]},{"text":"Web (weather, news)","r":["Duet/DUET-03","Muse/DUETVIEW-03"],"w":[]},{"text":"Whatever the task names","r":["Claude Cowork/CLAUDE-11"],"w":[]}],"r_self":["Duet","Grok Bot","Muse","Claude Cowork","ChatGPT"],"w_self":["Grok Bot","Claude Cowork","ChatGPT"],"r_view":["Grok Bot","ChatGPT","Muse","Duet"],"w_view":["Grok Bot","Duet","Claude Cowork"]}],"load":{"Mon":{"Kyle":{"clock":8,"event":11},"Mom":{"clock":1,"event":0},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}},"Tue":{"Kyle":{"clock":6,"event":11},"Mom":{"clock":0,"event":1},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}},"Wed":{"Kyle":{"clock":10,"event":11},"Mom":{"clock":1,"event":1},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}},"Thu":{"Kyle":{"clock":9,"event":11},"Mom":{"clock":1,"event":2},"Gwen":{"clock":1,"event":0},"Cathy":{"clock":1,"event":0}},"Fri":{"Kyle":{"clock":10,"event":12},"Mom":{"clock":1,"event":0},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}},"Sat":{"Kyle":{"clock":8,"event":12},"Mom":{"clock":0,"event":0},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}},"Sun":{"Kyle":{"clock":6,"event":11},"Mom":{"clock":0,"event":0},"Gwen":{"clock":0,"event":0},"Cathy":{"clock":0,"event":0}}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYFULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const DATE = {Mon:'Nov 16',Tue:'Nov 17',Wed:'Nov 18',Thu:'Nov 19',Fri:'Nov 20',Sat:'Nov 21',Sun:'Nov 22'};
const GROUPS = ['Duet','Grok Bot','Muse','Claude Cowork','ChatGPT','People'];
const GC = {'Duet':'g-duet','Grok Bot':'g-grok','Muse':'g-muse','Claude Cowork':'g-claude','ChatGPT':'g-cgpt','People':'g-people'};
const E = new Map(D.events.map(e => [e.key, e]));
const LANE = new Map(D.lanes.map(l => [l.id, l]));
const TIMED = new Set(D.events.filter(e => e.ttype === 'clock' && e.day.length).map(e => e.lane));
const WLANES = D.lanes.filter(l => TIMED.has(l.id));
const LIDX = new Map(WLANES.map((l, i) => [l.id, i]));
const HH = 34;
const C = D.meta.counts;
const CONF = new Map(D.conflicts.map(c => [c.id, c]));
const CSRC = new Map(D.conflict_sources.map(c => [c.ref, c]));
const STATUS = {open:'Open', standing:'Standing overlap', resolved:'Resolved', 'partly-fixed':'Partly fixed', 'not-conflict':'Not a conflict', info:'Handled in this merge'};
const KIND = {time:'time differs by more than 15 min', timing:'clock time vs event-driven or unknown', days:'days differ', status:'paused or ended vs active', 'status-minor':'active vs conditional', step:'filed under a different step', crosscheck:'corrected by the crosscheck'};
const FKIND = {drive:'Drive files and folders', site:'Sites and pages', mail:'Mail', web:'Listing sites', chat:'Chat and pushes', other:'Other'};

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'data') for (const [a, b] of Object.entries(v)) el.dataset[a] = b;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const mins = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const t12 = t => { const hh = +t.slice(0, 2); return ((hh + 11) % 12 + 1) + ':' + t.slice(3, 5) + (hh < 12 ? ' AM' : ' PM'); };
const group = e => LANE.get(e.lane).group;
const canon = k => { const e = E.get(k); return e && e.match ? e.match.self : k; };
const daysText = e => !e.day.length ? 'No day given' : e.day.length === 7 ? 'Every day' : e.day.join(', ');
function timeText(e) {
  if (e.ttype === 'event') return 'Event-driven';
  if (e.ttype === 'unknown') return 'Time unknown';
  if (e.range) return 'about ' + t12(e.times[0]) + ' to ' + t12(e.times[e.times.length - 1]) + ' (one run, send times seen)';
  return (e.approx ? 'about ' : '') + e.times.map(t12).join(', ');
}
const laneText = e => { const l = LANE.get(e.lane); return l.group === l.label ? l.label : (e.lane === 'people' ? e.agent : l.group + ' / ' + l.label); };
const isMM = e => !!(e.match && e.match.kinds.length && !e.match.minor);

/* dependency graph over canonical (owner's) events */
const UP = new Map(), DOWN = new Map();
function link(m, a, b, own) { if (!m.has(a)) m.set(a, new Map()); const x = m.get(a); x.set(b, (x.get(b) || false) || own); }
for (const e of D.events) { const a = canon(e.key); for (const d of e.deps) { if (!d.canon || d.canon === a) continue; link(UP, a, d.canon, e.own); link(DOWN, d.canon, a, e.own); } }
function walk(root, M, max = 6) {
  const depth = new Map([[root, 0]]); let q = [root];
  while (q.length) { const nq = []; for (const n of q) { if (depth.get(n) >= max) continue; for (const [o] of (M.get(n) || [])) if (!depth.has(o)) { depth.set(o, depth.get(n) + 1); nq.push(o); } } q = nq; }
  depth.delete(root); return depth;
}

/* state */
const mobile = () => window.innerWidth < 760;
function today() { try { const d = new Intl.DateTimeFormat('en-US', {weekday:'short', timeZone:'America/Phoenix'}).format(new Date()); return DAYS.includes(d) ? d : 'Mon'; } catch (_) { return 'Mon'; } }
const S = {
  tab:'grid', scope: mobile() ? today() : 'week', showViews:true, panel:true, q:'', sel:null, trace:null,
  path:null, conflict:null, mism:null, cfilter:'all', groupsOff:new Set(),
  ntf:{who:new Set(['Kyle','Mom','Gwen/Cathy','Other']), how:new Set(['chat','push','email','other']), cond:false, views:false},
  fkind:'drive', fopen:new Set(), popen:new Set(), copen:new Set(),
};
function set(patch) { Object.assign(S, patch); render(); }

function ntfInfo(e) {
  const who = (e.ntf.who.length ? e.ntf.who : ['Other']).map(w => (w === 'Gwen' || w === 'Cathy') ? 'Gwen/Cathy' : (w === 'Agent' ? 'Other' : w));
  const how = e.ntf.how.map(x => (x === 'page' || x === 'unspecified') ? 'other' : x);
  return {who:[...new Set(who)], how:[...new Set(how)]};
}
function ntfPass(e) {
  const n = e.ntf; if (n.state === 'none') return false;
  if (n.state === 'none-cond' && !S.ntf.cond) return false;
  if (!e.own && e.lane !== 'people' && !S.ntf.views) return false;
  const i = ntfInfo(e);
  return i.who.some(w => S.ntf.who.has(w)) && i.how.some(x => S.ntf.how.has(x));
}
function visible(e) {
  if (S.groupsOff.has(group(e))) return false;
  if (S.tab === 'ntf') return ntfPass(e);
  if (!S.showViews && !e.own && e.lane !== 'people') return false;
  return true;
}
function hay(e) { return e._h || (e._h = [e.key, e.name, e.action, e.agent, e.sub_agent, e.writer, e.match_key, e.recurrence, e.notifies, e.notes, e.ref, laneText(e), e.sources.join(' '), e.outputs.join(' '), e.tools.join(' ')].join(' \n ').toLowerCase()); }
function searchHits() { const q = S.q.trim().toLowerCase(); if (!q) return null; const ws = q.split(/\s+/); return D.events.filter(e => ws.every(w => hay(e).includes(w))); }

let HL = {on:false, m:new Map()};
function computeHL() {
  const m = new Map(); const hits = searchHits();
  if (hits) { hits.forEach(e => m.set(e.key, 'hit')); return {on:true, m}; }
  if (S.tab === 'paths' && S.path) {
    const p = D.paths.find(x => x.id === S.path.id);
    if (p) {
      if (S.path.def == null) { p.tagged.forEach(k => m.set(k, 'hit')); p.defs.forEach(d => d.branches.forEach(b => b.events.concat(b.canon).forEach(k => m.set(k, 'hit')))); }
      else { const b = p.defs[S.path.def].branches[S.path.br]; b.events.concat(b.canon).forEach(k => m.set(k, 'hit')); }
      return {on:true, m};
    }
  }
  if (S.tab === 'deps' && S.trace) {
    const root = canon(S.trace); const tag = (k, c) => { m.set(k, c); (E.get(k).seen_by || []).forEach(v => m.set(v, c)); };
    for (const [k] of walk(root, UP)) tag(k, 'up');
    for (const [k] of walk(root, DOWN)) tag(k, m.get(k) === 'up' ? 'up' : 'down');
    tag(root, 'sel'); return {on:true, m};
  }
  if (S.tab === 'conf' && S.conflict) { CONF.get(S.conflict).events.forEach(k => m.set(k, 'hit')); return {on:true, m}; }
  if (S.tab === 'conf' && S.mism) { const v = E.get(S.mism); m.set(v.key, 'hit'); m.set(v.match.self, 'hit'); return {on:true, m}; }
  return {on:false, m};
}
function ntfCls(e) {
  const i = ntfInfo(e); const wc = {Kyle:'w-kyle', Mom:'w-mom', 'Gwen/Cathy':'w-gwen', Other:'w-oth'};
  const how = i.how.includes('push') ? 'push' : i.how.includes('email') ? 'email' : i.how.includes('chat') ? 'chat' : 'other';
  return 'nt ' + wc[i.who[0]] + ' h-' + how + (i.who.length > 1 ? ' multi' : '') + (e.ntf.state === 'none-cond' ? ' cond' : '');
}
function ntfStyle(e) { const i = ntfInfo(e); const v = {Kyle:'--kyle', Mom:'--mom', 'Gwen/Cathy':'--gwen', Other:'--oth'}; return i.who.length > 1 ? `--c2:var(${v[i.who[1]]})` : ''; }
function ecls(e, base) {
  const c = [base, GC[group(e)], e.own ? 'self' : 'view', 'cf-' + e.confidence];
  if (e.lane === 'people') c.push('ppl');
  if (isMM(e)) c.push('mm');
  if (e.approx) c.push('approx');
  if (e.status === 'paused' || e.status === 'ended') c.push('off');
  if (S.tab === 'ntf') c.push(ntfCls(e));
  if (HL.on) c.push(HL.m.has(e.key) ? 'hl ' + HL.m.get(e.key) : 'dim');
  if (S.sel === e.key) c.push('cur');
  return c.join(' ');
}
function tip(e, t) { return [t || timeText(e), laneText(e), e.name, e.own ? e.confidence : 'as seen by ' + e.writer + (isMM(e) ? ' (differs from the owner)' : ''), e.key].join(' | '); }
function pick(e) {
  if (S.tab === 'deps') set({trace:e.key, sel:null});
  else set({sel:e.key});
}

/* ---------- week grid ---------- */
function mark(e, t0, t1) {
  const top = mins(t0) / 60 * HH; const hgt = t1 ? Math.max(7, (mins(t1) - mins(t0)) / 60 * HH) : 7;
  const y = t1 ? top : Math.min(Math.max(0, top - 3.5), 24 * HH - 7);
  return h('button', {class:ecls(e, 'mk' + (t1 ? ' rng' : '')), style:`top:${y.toFixed(1)}px;height:${hgt.toFixed(1)}px;${S.tab === 'ntf' ? ntfStyle(e) : ''}`, tabindex:'-1', data:{k:e.key, lane:e.lane}, title:tip(e, t1 ? null : (e.approx ? 'about ' : '') + t12(t0)), 'aria-label':e.name, onclick:() => pick(e)});
}
function dot(e) { return h('button', {class:ecls(e, 'dot'), style:S.tab === 'ntf' ? ntfStyle(e) : '', tabindex:'-1', data:{k:e.key, lane:e.lane}, title:tip(e), 'aria-label':e.name, onclick:() => pick(e)}); }
function renderWeek(root, evs) {
  const g = h('div', {class:'wkg', style:`--n:${WLANES.length};--hh:${HH}px`});
  g.append(h('div', {class:'rowlab'}, ''));
  DAYS.forEach(d => g.append(h('button', {class:'dayh', title:'Open ' + DAYFULL[d] + ' as a list', onclick:() => set({scope:d})}, h('b', null, d), h('span', null, DATE[d]))));
  g.append(h('div', {class:'dayh nod last'}, 'No day'));
  g.append(h('div', {class:'rowlab'}, 'Lane'));
  DAYS.forEach(() => g.append(h('div', {class:'lc'}, WLANES.map(l => h('span', {class:GC[l.group], title:l.group === l.label ? l.label : l.group + ' / ' + l.label}, l.code)))));
  g.append(h('div', {class:'last'}));
  const ord = evs.slice().sort((a, b) => (D.lanes.findIndex(l => l.id === a.lane) - D.lanes.findIndex(l => l.id === b.lane)) || (a.own === b.own ? 0 : a.own ? -1 : 1));
  for (const [tt, label] of [['event', 'Event-driven'], ['unknown', 'Time unknown']]) {
    g.append(h('div', {class:'rowlab'}, label));
    [...DAYS, null].forEach(d => g.append(h('div', {class:'strip' + (d ? '' : ' last'), data:{strip:tt, day:d || 'none'}}, ord.filter(e => e.ttype === tt && (d ? e.day.includes(d) : !e.day.length)).map(dot))));
  }

  for (let i = 0; i <= 24; i += 2) gut.append(h('span', {style:`top:${i * HH}px` + (i === 24 ? ';transform:translateY(-100%)' : '')}, i === 0 || i === 24 ? '12 AM' : i === 12 ? '12 PM' : (i % 12) + (i < 12 ? ' AM' : ' PM')));
  g.append(gut);
  const drawOrder = evs.slice().sort((a, b) => (a.own === b.own ? 0 : a.own ? 1 : -1));
  DAYS.forEach(d => {
    const col = h('div', {class:'tg', data:{day:d}});
    let alt = false;
    WLANES.forEach((l, i) => { const gs = i && WLANES[i - 1].group !== l.group; if (gs) alt = !alt; col.append(h('div', {class:'ln ' + GC[l.group] + (gs ? ' gs' : '') + (alt ? ' alt' : ''), style:`left:calc(${i}*100%/var(--n))`})); });
    for (const e of drawOrder) {
      if (e.ttype !== 'clock' || !e.day.includes(d)) continue;
      const lc = col.children[LIDX.get(e.lane)];
      if (e.range) lc.append(mark(e, e.times[0], e.times[e.times.length - 1])); else e.times.forEach(t => lc.append(mark(e, t)));
    }
    g.append(col);
  });
  const nd = h('div', {class:'tg one last', data:{day:'none'}}, h('div', {class:'ln'}));
  for (const e of drawOrder) if (e.ttype === 'clock' && !e.day.length) { if (e.range) nd.firstChild.append(mark(e, e.times[0], e.times[e.times.length - 1])); else e.times.forEach(t => nd.firstChild.append(mark(e, t))); }
  g.append(nd);
  root.append(h('div', {class:'wk', id:'weekgrid'}, g));
}

/* ---------- day list ---------- */
function chip(e, extra) {
  const meta = [e.id, e.own ? e.confidence : 'seen by ' + e.writer];
  if (e.status && e.status !== 'active') meta.push(e.status);
  if (e.ntf.state === 'yes' || e.ntf.state === 'unknown') meta.push('tells ' + (e.ntf.who.join(', ') || 'someone'));
  const folded = extra && extra.folded ? extra.folded : 0;
  return h('button', {class:ecls(e, 'chip'), data:{k:e.key, lane:e.lane}, onclick:() => pick(e), style:S.tab === 'ntf' ? ntfStyle(e) : ''},
    h('span', {class:'l'}, laneText(e)),
    h('span', {class:'nm'}, e.name),
    h('span', {class:'mt'}, meta.join(' · ')),
    (isMM(e) || e.range || (e.approx && e.ttype === 'clock') || folded) ? h('span', {class:'mt'},
      isMM(e) ? h('span', {class:'tag w'}, 'differs from owner') : null,
      e.range ? h('span', {class:'tag'}, 'about ' + t12(e.times[0]) + ' to ' + t12(e.times[e.times.length - 1])) : (e.approx && e.ttype === 'clock' ? h('span', {class:'tag'}, 'about') : null),
      folded ? h('span', {class:'tag'}, 'also seen by ' + folded) : null) : null);
}
function renderDay(root, evs, d) {
  const fold = e => !e.own && e.lane !== 'people' && e.match && !isMM(e) && S.tab !== 'ntf';
  const list = evs.filter(e => e.day.includes(d));
  const foldedBy = new Map();
  list.filter(fold).forEach(v => foldedBy.set(v.match.self, (foldedBy.get(v.match.self) || 0) + 1));
  const rows = new Map();
  const put = (k, e) => { if (!rows.has(k)) rows.set(k, []); rows.get(k).push(e); };
  for (const e of list) {
    if (fold(e) && list.some(x => x.key === e.match.self)) continue;
    if (e.ttype === 'clock') (e.range ? [e.time] : e.times).forEach(t => put(t, e)); else put(e.ttype === 'event' ? 'zz-event' : 'zz-unknown', e);
  }
  const lo = k => D.lanes.findIndex(l => l.id === k);
  const box = h('div', {class:'day', id:'daylist'});
  [...rows.keys()].sort().forEach(k => {
    const es = rows.get(k).sort((a, b) => lo(a.lane) - lo(b.lane) || (a.own === b.own ? 0 : a.own ? -1 : 1));
    const lab = k === 'zz-event' ? ['Event-driven', 'when something happens'] : k === 'zz-unknown' ? ['Time unknown', ''] : [t12(k), ''];
    box.append(h('div', {class:'trow'}, h('div', {class:'tm'}, lab[0], h('small', null, lab[1] || (es.length + (es.length === 1 ? ' item' : ' items')))), h('div', {class:'cs'}, es.map(e => chip(e, {folded:foldedBy.get(e.key)})))));
  });
  if (!rows.size) box.append(h('div', {class:'trow'}, h('div', {class:'tm'}, 'Nothing'), h('div', {class:'cs mut'}, 'No events match on this day.')));

    h('p', null, h('span', {class:'tag c ' + GC[group(e)]}, laneText(e)), h('span', {class:'tag'}, e.own ? 'own run' : (e.lane === 'people' ? 'person, as ' + e.writer + ' describes' : 'view by ' + e.writer)), h('span', {class:'tag'}, 'confidence: ' + e.confidence), e.status ? h('span', {class:'tag'}, e.status) : null, e.approx ? h('span', {class:'tag'}, 'approximate time') : null, isMM(e) ? h('span', {class:'tag w'}, 'differs from owner') : null),
    e.xnote ? h('div', {class:'note warn'}, e.xnote) : null,
    h('dl', null,
      row('What it does', e.action), row('Days', daysText(e)), row('Time', timeText(e)), row('Repeats', e.recurrence),
      row('Who hears', e.notifies), row('Reads', e.sources), row('Writes', e.outputs), row('Tools', e.tools.join(', ')),
      row('Needs first', e.deps.map(d => d.key ? h('span', null, evLink(d.canon), d.canon !== d.key ? h('span', {class:'mut'}, ' (listed as ' + d.raw + ')') : (d.via === 'match_key' ? h('span', {class:'mut'}, ' (by step name ' + d.raw + ')') : null)) : d.raw + ' (not found)')),
      row('Paths', e.paths.map(pid => h('button', {class:'lk', onclick:() => { S.popen.add(pid); set({tab:'paths', path:{id:pid, def:null, br:null}, sel:null}); }}, pid))),
      row('Step key', e.match_key), row('Job reference', e.ref), row('Notes', e.notes), row('Id', e.key), row('From file', 'Weekly Flow - ' + e.writer),
      e.match ? row('Owner\'s event', h('span', null, evLink(e.match.self), e.match.kinds.length ? h('ul', null, e.match.detail.map(t => h('li', null, t))) : h('span', {class:'mut'}, ' (matches)'))) : null,
      e.seen_by.length ? row('Seen by', e.seen_by.map(k => h('span', null, evLink(k, E.get(k).writer + ' (' + E.get(k).id + ')'), isMM(E.get(k)) ? h('span', {class:'tag w', style:'margin-left:6px'}, 'differs') : null))) : null,
      inConf.length ? row('In conflicts', inConf.map(c => h('button', {class:'lk', onclick:() => set({tab:'conf', conflict:c.id, mism:null, cfilter:'all', sel:null})}, c.id + ': ' + c.title))) : null,
      (e.key !== r) ? null : row('Feeds', dns.map(k => evLink(k)))),
    h('p', {style:'margin-top:12px'}, h('button', {class:'btn', id:'tracebtn', onclick:() => set({tab:'deps', trace:e.key, sel:null})}, 'Trace dependencies (' + ups.length + ' before, ' + dns.length + ' after)')));
  dr.replaceChildren(h('div', {class:'dh'}, h('h2', null, e.name), h('button', {class:'btn', id:'closedrawer', 'aria-label':'Close details', onclick:() => set({sel:null})}, 'Close')), body);
}

/* ---------- shell ---------- */
const TABS = [['grid', 'Week grid', C.events], ['paths', 'Paths', C.path_ids], ['deps', 'Dependencies', ''], ['ntf', 'Notifications', ''], ['conf', 'Conflicts', C.conflicts_merged], ['files', 'Files', D.files.length]];
function renderTabs() {
  $('#tabs').replaceChildren(...TABS.map(([id, label, n]) => h('button', {class:'tab', role:'tab', id:'tab-' + id, 'aria-selected':String(S.tab === id), onclick:() => set({tab:id})}, label, n !== '' ? h('span', {class:'n'}, n) : null)));
}
function render() {
  HL = computeHL();
  $('#main').className = ((S.tab === 'files' || !S.panel) ? 'nopanel' : '') + (S.tab === 'grid' ? ' gridtab' : '');
  renderTabs(); renderPanel(); renderStage(); renderDrawer();
}
function theme(t) { document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; try { localStorage.setItem('wf-theme', t); } catch (_) {} }
let saved = null; try { saved = localStorage.getItem('wf-theme'); } catch (_) {}
theme(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

let tmr; $('#q').addEventListener('input', ev => { clearTimeout(tmr); tmr = setTimeout(() => set({q:ev.target.value}), 140); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sel) set({sel:null}); });
$('#subline').textContent = `Week of Mon Nov 16, 2026 · America/Phoenix · ${D.meta.files.length} agent files · ${C.events} events · merged Nov 18 with the Nov 18 crosscheck`;
const bad = D.meta.files.filter(f => !f.ok);
$('#foot').append(h('p', null, 'Read-only merge of the Weekly Flow files: Duet (Nov 16), Grok Bot, Muse, Claude Cowork and ChatGPT (Nov 17), plus the crosscheck of Nov 18. An agent\'s own entries are the truth for its lane; other agents\' views are faint. Nothing here changes a schedule or messages anyone.' + (bad.length ? ' Files that did not parse: ' + bad.map(f => f.title).join(', ') + '.' : ' All five JSON blocks parsed.')));
render();
